[common]
api_mode=true
; Filled from API_TOKEN by the entrypoint; no built-in public password.
api_access_token=
enable_insert=false
prepend_insert_url=true
base_path=base
clash_rule_base=base/all_base.tpl
surge_rule_base=base/all_base.tpl
surfboard_rule_base=base/all_base.tpl
mellow_rule_base=base/all_base.tpl
quan_rule_base=base/all_base.tpl
quanx_rule_base=base/all_base.tpl
loon_rule_base=base/all_base.tpl
sssub_rule_base=base/all_base.tpl
singbox_rule_base=base/all_base.tpl
proxy_config=NONE
proxy_ruleset=NONE
proxy_subscription=NONE
reload_conf_on_request=false

[node_pref]
sort_flag=false
filter_deprecated_nodes=false
append_sub_userinfo=true
clash_use_new_field_name=true
clash_proxies_style=block
clash_proxy_groups_style=block

[emojis]
add_emoji=false
remove_old_emoji=false

[rulesets]
enabled=true
overwrite_original_rules=true
update_ruleset_on_request=false
; Basic routing only: no large ad/media rule sets or startup downloads.
ruleset=DIRECT,[]GEOIP,CN
ruleset=PROXY,[]FINAL

[proxy_groups]
custom_proxy_group=PROXY`select`[]AUTO`[]DIRECT`.*
custom_proxy_group=AUTO`url-test`.*`http://www.gstatic.com/generate_204`300

[template]
template_path=base
clash.http_port=7890
clash.socks_port=7891
clash.allow_lan=false
clash.log_level=info
clash.external_controller=127.0.0.1:9090
singbox.allow_lan=false
singbox.mixed_port=2080

[aliases]
/v=/version
/clash=/sub?target=clash
/singbox=/sub?target=singbox
/surge=/sub?target=surge
/loon=/sub?target=loon
/quanx=/sub?target=quanx
/ss=/sub?target=ss
/ssr=/sub?target=ssr
/v2ray=/sub?target=v2ray

[server]
listen=0.0.0.0
port=25500
serve_file_root=

[advanced]
log_level=warn
print_debug_info=false
max_pending_connections=64
max_concurrent_threads=2
max_allowed_rulesets=64
max_allowed_rules=32768
max_allowed_download_size=16777216
enable_cache=false
script_clean_context=true
async_fetch_ruleset=false
skip_failed_links=false
